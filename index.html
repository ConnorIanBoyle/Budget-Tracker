<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Budget Tracker</h1>
            <div class="balance-container">
                <h2>Total Balance</h2>
                <h3 id="balance">$0.00</h3>
            </div>
            <div class="summary">
                <div class="income">
                    <h4>Income</h4>
                    <p id="money-plus" class="money plus">+$0.00</p>
                </div>
                <div class="expense">
                    <h4>Expense</h4>
                    <p id="money-minus" class="money minus">-$0.00</p>
                </div>
            </div>
        </header>

        <div class="main-content">
            <section class="controls">
                <div class="income-setup" style="margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #bbb;">
                    <h3>Set Monthly Income</h3>
                    <div class="form-control">
                        <label for="monthly-income-input">Base Income Amount</label>
                        <div style="display: flex; gap: 10px;">
                            <input type="number" id="monthly-income-input" placeholder="e.g. 4000" step="0.01" />
                            <button id="save-income-btn" class="btn" style="width: auto; padding: 10px 20px;">Save</button>
                        </div>
                    </div>
                </div>
                <h3>Add New Transaction</h3>
                <form id="form">
                    <div class="form-control">
                        <label for="text">Description</label>
                        <input type="text" id="text" placeholder="e.g. Groceries, Salary..." required />
                    </div>
                    
                    <div class="form-control">
                        <label for="amount">Amount</label>
                        <input type="number" id="amount" placeholder="Enter amount..." required step="0.01"/>
                    </div>

                    <div class="form-control">
                        <label for="type">Type</label>
                        <select id="type" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>

                    <div class="form-control" id="category-container">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="Food">Food</option>
                            <option value="Rent">Rent</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Transport">Transport</option>
                            <option value="Company Tax & Investments">Company Tax & Investments</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <button type="submit" class="btn">Add Transaction</button>
                </form>
            </section>

            <section class="visuals">
                <h3>Spending Breakdown</h3>
                <canvas id="expenseChart"></canvas>
            </section>
        </div>

        <section class="history">
            <h3>Transaction History</h3>
            <ul id="list" class="list">
                </ul>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
